name: Build S24 FE app payload

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'Makefile'
      - '.github/workflows/build.yml'

permissions:
  contents: write

env:
  TARGET: r12s-S721BXXSCDZF3
  NDK_VERSION: '30.0.16248370'
  APP_PAYLOAD: build/r12s-S721BXXSCDZF3/cve-2026-43499-app.release.so
  REPO_PAYLOAD: artifacts/r12s-S721BXXSCDZF3/cve-2026-43499-app.so

jobs:
  build:
    name: Build cve-2026-43499-app.so
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Verify NDK
        shell: bash
        run: |
          set -euo pipefail
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android36-clang"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android36-clang" --version | head -n 1

      - name: Verify target sources
        shell: bash
        run: |
          set -euo pipefail
          test -f "src/targets/${TARGET}/target.h"
          test -f "src/main.c"
          test -f "src/fops.c"
          test "$(grep -c 'APP_PRODUCTION_STACK_PI_RIGHT_ONLY' "src/targets/${TARGET}/target.h")" -ge 1
          grep -F 'APP_PRODUCTION_STACK_PI_RIGHT_ONLY' "src/targets/${TARGET}/target.h"

      - name: Clean build
        shell: bash
        run: |
          set -euo pipefail
          make clean TARGET="${TARGET}"

      - name: Build release app payload
        shell: bash
        run: |
          set -euo pipefail
          make TARGET="${TARGET}" release

      - name: Verify output
        shell: bash
        run: |
          set -euo pipefail
          test -f "${APP_PAYLOAD}"

          SIZE=$(stat -c '%s' "${APP_PAYLOAD}")

          echo "APP PAYLOAD SIZE: ${SIZE} bytes"

          file "${APP_PAYLOAD}"
          sha256sum "${APP_PAYLOAD}"

      - name: Copy payload into repository
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$(dirname "${REPO_PAYLOAD}")"
          cp "${APP_PAYLOAD}" "${REPO_PAYLOAD}"

          SIZE=$(stat -c '%s' "${REPO_PAYLOAD}")

          echo "REPOSITORY PAYLOAD: ${REPO_PAYLOAD}"
          echo "SIZE: ${SIZE} bytes"

      - name: Commit payload to repository
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${REPO_PAYLOAD}"

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          SIZE=$(stat -c '%s' "${REPO_PAYLOAD}")

          git commit -m "Build ${TARGET} release payload (${SIZE} bytes)"
          git push

      - name: Upload app payload
        uses: actions/upload-artifact@v4
        with:
          name: cve-2026-43499-app
          path: ${{ env.REPO_PAYLOAD }}
          if-no-files-found: error
          retention-days: 14
