name: Build S24 FE S721B Payload Artifact

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'Makefile'
      - 'support/targets-v3.json'
      - 'tools/**'
      - '.github/workflows/**'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: payload-artifact-s721b
  cancel-in-progress: false

env:
  TARGET: r12s-S721BXXSCDZF3
  ARTIFACT_PATH: artifacts/r12s-S721BXXSCDZF3/cve-2026-43499-app.so

jobs:
  build:
    name: Build S721B Payload
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35'
          accept-android-sdk-licenses: true

      - name: Set up NDK r28
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Resolve NDK path
        shell: bash
        run: |
          set -euo pipefail

          NDK_HOME="$(find "${ANDROID_SDK_ROOT}/ndk" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d | sort -V | tail -n 1)"

          test -n "$NDK_HOME"

          echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          echo "Using ANDROID_NDK_HOME=$NDK_HOME"

      - name: Build S721B
        shell: bash
        run: |
          set -euo pipefail

          test -f "src/targets/${TARGET}/target.h"

          make clean TARGET="${TARGET}"
          make all release TARGET="${TARGET}"

          output="build/${TARGET}/cve-2026-43499-app.release.so"

          test -f "$output"

          size="$(stat -c %s "$output")"
          echo "Built artifact size: ${size} bytes"

          test "$size" -le 104128

          mkdir -p "$(dirname "${ARTIFACT_PATH}")" diagnostics

          install -m 0644 \
            "$output" \
            "${ARTIFACT_PATH}"

          sha256sum "${ARTIFACT_PATH}" \
            | tee diagnostics/s721b-app.sha256

      - name: Verify artifact
        shell: bash
        run: |
          set -euo pipefail

          test -f "${ARTIFACT_PATH}"

          size="$(stat -c %s "${ARTIFACT_PATH}")"

          echo "Final artifact: ${ARTIFACT_PATH}"
          echo "Final size: ${size} bytes"

          test "$size" -le 104128

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: s721b-payload-build-diagnostics
          path: diagnostics/
          if-no-files-found: error
          retention-days: 14

      - name: Commit regenerated artifact
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "${ARTIFACT_PATH}"

          if git diff --cached --quiet; then
            echo "No artifact changes."
            exit 0
          fi

          git commit \
            -m "ci: rebuild S721B payload artifact [skip ci]"

          git push origin HEAD:main


