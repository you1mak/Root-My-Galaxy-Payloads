name: Build Root-My-Galaxy Payload

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Show build configuration
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          ls "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android36-clang"

      - name: Build payload
        run: |
          make TARGET=r12s-S721BXXSCDZF3 all

      - name: Verify app payload
        run: |
          ls -lh build/r12s-S721BXXSCDZF3/cve-2026-43499-app.so
          file build/r12s-S721BXXSCDZF3/cve-2026-43499-app.so

      - name: Upload app payload
        uses: actions/upload-artifact@v4
        with:
          name: cve-2026-43499-app
          path: build/r12s-S721BXXSCDZF3/cve-2026-43499-app.so
